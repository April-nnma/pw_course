name: Playwright Smoke Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke -- --reporter=line,html

      - name: Upload Playwright report and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-smoke-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
